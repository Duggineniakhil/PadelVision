# Every model the pipeline can load. Weights are NOT committed; fetch them with:
#   python scripts/fetch_models.py [name ...]
# Code loads weights only via padelvision.models.registry.weights_path(name).
#
# Adding a model (e.g. after training on Kaggle):
#   1. upload the weights to the Hugging Face Hub
#   2. add an entry below with the direct download URL and sha256
#   3. record eval metrics in `notes`

models:
  person-detector:
    file: yolo11s.pt
    url: https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11s.pt
    sha256: 85a76fe86dd8afe384648546b56a7a78580c7cb7b404fc595f97969322d502d5
    task: detect
    license: AGPL-3.0
    source: Ultralytics YOLO11, COCO-pretrained (class 0 = person)
    notes: Default player detector.

  person-detector-fast:
    file: yolo11n.pt
    url: https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11n.pt
    sha256: 0ebbc80d4a7680d14987a577cd21342b65ecfd94632bd9a8da63ae6417644ee1
    task: detect
    license: AGPL-3.0
    source: Ultralytics YOLO11, COCO-pretrained (class 0 = person)
    notes: Smaller/faster; for quick CPU checks on short clips.

  ball-detector:
    file: padel_ball_yolo11s.pt
    url: https://github.com/Duggineniakhil/PadelVision/releases/download/ball-yolo11s-v1/padel_ball_yolo11s.pt
    sha256: 112bfdeaecc51a4074d9d3ee823cd856c829f80d7931ddb661b4fb1ef4dd2e5d
    task: detect
    license: AGPL-3.0 (weights); training data CC BY 4.0 (Roboflow Universe, see model card)
    source: YOLO11s fine-tuned on padel balls (ml/notebooks/04_train_ball.ipynb), docs/models/padel_ball_yolo11s.md
    notes: >-
      One class (0 = ball), imgsz 1280, use conf >= 0.10. Held-out Test_video blocks (68 frames):
      F1 0.79 (recall 0.72, precision 0.88) vs Roboflow nazbq 0.65, COCO sports ball 0.52.
